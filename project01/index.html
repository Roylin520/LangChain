<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="蜂巢突擊 — 網頁版小蜜蜂射擊遊戲">
</head>
<body>
<title>蜂巢突擊 Hive Assault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
  :root{
    --void:#0a0b1a;
    --void-2:#12142c;
    --bezel:#1b1e3d;
    --honey:#ffc233;
    --honey-deep:#e8890a;
    --cyan:#4fe3d8;
    --rose:#ff4d6d;
    --cream:#f4e9d0;
    --dim:#8a86a8;
    --pixel:"Press Start 2P","Courier New",monospace;
    --han:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    background:var(--void);
    color:var(--cream);
    font-family:var(--han);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:24px 16px 32px;
    background-image:
      radial-gradient(1200px 700px at 50% -10%, #1a1d3f 0%, transparent 60%),
      radial-gradient(700px 500px at 12% 110%, #241a30 0%, transparent 60%);
  }

  header.marquee{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .title{
    font-family:var(--pixel);
    font-size:clamp(15px,3.4vw,26px);
    letter-spacing:.06em;
    color:var(--honey);
    text-shadow:0 0 18px rgba(255,194,51,.35), 0 3px 0 var(--honey-deep);
    margin:0;
  }
  .subtitle{
    font-size:13px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--dim);
    margin:0;
  }

  .cabinet{
    position:relative;
    padding:14px;
    border-radius:16px;
    background:linear-gradient(180deg,var(--bezel),#0e1027);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.09),
      inset 0 0 0 1px rgba(79,227,216,.12),
      0 26px 60px -24px rgba(0,0,0,.95);
    max-width:100%;
  }
  .screen{position:relative;line-height:0;border-radius:8px;overflow:hidden;background:#05060f}
  canvas{
    display:block;
    width:min(880px,90vw);
    height:auto;
    aspect-ratio:4/3;
    image-rendering:pixelated;
    touch-action:none;
    cursor:crosshair;
  }
  .screen::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.30) 0 1px, transparent 1px 3px),
      radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
    mix-blend-mode:multiply;
  }
  canvas:focus-visible{outline:3px solid var(--cyan);outline-offset:-3px}

  .legend{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px 26px;
    font-size:14px;
    color:var(--dim);
  }
  .legend b{
    font-family:var(--pixel);
    font-size:10px;
    color:var(--cyan);
    background:rgba(79,227,216,.09);
    border:1px solid rgba(79,227,216,.25);
    border-radius:4px;
    padding:5px 7px;
    margin-right:7px;
    letter-spacing:.02em;
  }
  .legend span{display:inline-flex;align-items:center}

  .bestiary{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px 22px;
    font-size:13px;
    color:var(--dim);
  }
  .bestiary i{
    width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:8px;
    vertical-align:-1px;
  }
  .bestiary em{font-style:normal;color:var(--cream)}
  .bestiary strong{
    font-family:var(--pixel);font-size:10px;color:var(--honey);margin-left:8px;
  }

  .touchpad{display:none;gap:12px;width:min(880px,90vw)}
  .touchpad button{
    flex:1;
    padding:16px 0;
    font-family:var(--pixel);
    font-size:12px;
    color:var(--cream);
    background:var(--void-2);
    border:1px solid rgba(244,233,208,.16);
    border-radius:10px;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  .touchpad button:active{background:var(--honey);color:var(--void);border-color:var(--honey)}
  .touchpad button.fire:active{background:var(--cyan)}
  @media (hover:none) and (pointer:coarse){ .touchpad{display:flex} .legend{display:none} }
</style>

<header class="marquee">
  <h1 class="title">蜂巢突擊</h1>
  <p class="subtitle">Hive Assault &nbsp;·&nbsp; Arcade Mode</p>
</header>

<div class="cabinet">
  <div class="screen">
    <canvas id="game" width="800" height="600" tabindex="0" aria-label="小蜜蜂射擊遊戲畫面"></canvas>
  </div>
</div>

<div class="touchpad" aria-hidden="true">
  <button id="btnL" type="button">◀ 左</button>
  <button id="btnF" class="fire" type="button">發射</button>
  <button id="btnR" type="button">右 ▶</button>
</div>

<div class="legend">
  <span><b>← →</b>移動</span>
  <span><b>SPACE</b>發射</span>
  <span><b>P</b>暫停</span>
  <span><b>M</b>靜音</span>
  <span><b>ENTER</b>開始 / 重來</span>
</div>

<div class="bestiary">
  <span><i style="background:#ff8bb0"></i><em>蜂后</em><strong>30</strong></span>
  <span><i style="background:#ffc233"></i><em>工蜂</em><strong>20</strong></span>
  <span><i style="background:#e8890a"></i><em>雄蜂</em><strong>10</strong></span>
  <span><i style="background:#4fe3d8"></i><em>蜂巢母艦</em><strong>50–300</strong></span>
</div>

<script>
(() => {
  "use strict";

  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d", { alpha: false });
  const W = cv.width, H = cv.height;

  /* ---------- 像素圖：'#' 主體色，'=' 條紋色 ---------- */
  const SPR = {
    queen: [[
      "..#.#.#....",
      "...###.....",
      "##.#####.##",
      ".#=======#.",
      "..#######..",
      "..=======..",
      "..#######..",
      "...##.##..."
    ], [
      "..#.#.#....",
      "...###.....",
      "#..#####..#",
      ".#=======#.",
      "..#######..",
      "..=======..",
      "..#######..",
      "..#.#.#.#.."
    ]],
    worker: [[
      "##.......##",
      ".##.....##.",
      "...#####...",
      "..#######..",
      "..=======..",
      "..#######..",
      "..=======..",
      "...##.##..."
    ], [
      "...........",
      "##.......##",
      ".#.#####.#.",
      "..#######..",
      "..=======..",
      "..#######..",
      "..=======..",
      "...#.#.#..."
    ]],
    drone: [[
      "#.......#",
      ".#.....#.",
      "..#####..",
      "..=====..",
      "..#####..",
      "..=====..",
      "...#.#..."
    ], [
      ".........",
      "#.#####.#",
      ".#=====#.",
      "..#####..",
      "..=====..",
      "..#####..",
      "..##.##.."
    ]],
    ship: [
      "......#......",
      ".....###.....",
      "....##=##....",
      "..#########..",
      ".###########.",
      "#############",
      "#####===#####",
      "##.##...##.##"
    ],
    hive: [
      "....######....",
      "..##########..",
      ".############.",
      "##=##=##=##=##",
      "##############",
      "..###....###..",
      "...#......#..."
    ]
  };

  const PAL = {
    void: "#0a0b1a", cream: "#f4e9d0", dim: "#8a86a8",
    honey: "#ffc233", honeyDeep: "#e8890a", cyan: "#4fe3d8", rose: "#ff4d6d",
    queenBody: "#ff8bb0", queenStripe: "#7a2f4a",
    workerBody: "#ffc233", workerStripe: "#5a3a06",
    droneBody: "#e8890a", droneStripe: "#4a2404",
    shipStripe: "#0e6b66", hiveStripe: "#134f52"
  };

  const PX = 3; // 像素放大倍率

  function drawSprite(rows, x, y, main, stripe, scale) {
    const s = scale || PX;
    for (let r = 0; r < rows.length; r++) {
      const line = rows[r];
      for (let c = 0; c < line.length; c++) {
        const ch = line[c];
        if (ch === ".") continue;
        ctx.fillStyle = ch === "=" ? stripe : main;
        ctx.fillRect(x + c * s, y + r * s, s, s);
      }
    }
  }
  const sprW = (rows, s) => rows[0].length * (s || PX);
  const sprH = (rows, s) => rows.length * (s || PX);

  /* ---------- 音效 ---------- */
  let audio = null, muted = false;
  function ac() {
    if (audio === null) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audio = false; }
    }
    if (audio && audio.state === "suspended") audio.resume();
    return audio || null;
  }
  function tone(f0, f1, dur, type, vol) {
    if (muted) return;
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  }
  function noise(dur, vol, freq) {
    if (muted) return;
    const a = ac(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(); src.buffer = buf;
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(a.destination);
    src.start();
  }
  const STEP_NOTES = [92, 82, 73, 65];
  let stepNote = 0;
  const sfx = {
    shoot: () => tone(880, 220, 0.11, "square", 0.05),
    hit: () => noise(0.16, 0.16, 900),
    step: () => {
      tone(STEP_NOTES[stepNote], STEP_NOTES[stepNote] * 0.8, 0.09, "triangle", 0.09);
      stepNote = (stepNote + 1) & 3;
    },
    die: () => { tone(300, 40, 0.7, "sawtooth", 0.12); noise(0.5, 0.18, 300); },
    hive: () => tone(1200, 700, 0.18, "sine", 0.07),
    bonus: () => {
      tone(660, 1320, 0.18, "square", 0.07);
      setTimeout(() => tone(990, 1760, 0.2, "square", 0.06), 90);
    },
    level: () => [523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => tone(f, f, 0.13, "square", 0.06), i * 95)),
    shield: () => noise(0.07, 0.09, 400)
  };

  /* ---------- 蜂蠟掩體 ---------- */
  const SH_COLS = 22, SH_ROWS = 14, SH_CELL = 3;
  const SH_W = SH_COLS * SH_CELL, SH_H = SH_ROWS * SH_CELL;
  const SH_Y = H - 150;

  function buildShield(x) {
    const cells = [];
    for (let r = 0; r < SH_ROWS; r++) {
      const row = [];
      for (let c = 0; c < SH_COLS; c++) {
        let on = 1;
        const round = 4 - r;
        if (r < 4 && (c < round || c > SH_COLS - 1 - round)) on = 0;
        const notchTop = SH_ROWS - 5;
        if (r >= notchTop) {
          const half = Math.round((r - notchTop + 1) * 1.15);
          if (c >= SH_COLS / 2 - half && c < SH_COLS / 2 + half) on = 0;
        }
        row.push(on);
      }
      cells.push(row);
    }
    return { x: x, y: SH_Y, cells: cells };
  }
  let shields = [];
  function resetShields() {
    shields = [];
    const gap = (W - 4 * SH_W) / 5;
    for (let i = 0; i < 4; i++) shields.push(buildShield(Math.round(gap + i * (SH_W + gap))));
  }
  function shieldHit(sh, px, py, radius) {
    const cx = Math.floor((px - sh.x) / SH_CELL), cy = Math.floor((py - sh.y) / SH_CELL);
    if (cx < 0 || cy < 0 || cx >= SH_COLS || cy >= SH_ROWS) return false;
    if (!sh.cells[cy][cx]) return false;
    for (let r = cy - radius; r <= cy + radius; r++) {
      for (let c = cx - radius; c <= cx + radius; c++) {
        if (r < 0 || c < 0 || r >= SH_ROWS || c >= SH_COLS) continue;
        if ((r - cy) * (r - cy) + (c - cx) * (c - cx) <= radius * radius + 1) sh.cells[r][c] = 0;
      }
    }
    return true;
  }
  function collideShields(x, y, w, h, radius) {
    for (const sh of shields) {
      if (x + w < sh.x || x > sh.x + SH_W || y + h < sh.y || y > sh.y + SH_H) continue;
      for (let py = y; py <= y + h; py += SH_CELL) {
        for (let px = x; px <= x + w; px += SH_CELL) {
          if (shieldHit(sh, px, py, radius)) return true;
        }
      }
    }
    return false;
  }

  /* ---------- 遊戲狀態 ---------- */
  const KINDS = {
    queen: { spr: SPR.queen, main: PAL.queenBody, stripe: PAL.queenStripe, pts: 30 },
    worker: { spr: SPR.worker, main: PAL.workerBody, stripe: PAL.workerStripe, pts: 20 },
    drone: { spr: SPR.drone, main: PAL.droneBody, stripe: PAL.droneStripe, pts: 10 }
  };
  const ROWS = 5, COLS = 11, CELL_W = 48, CELL_H = 40, MARGIN = 22, DROP = 16;

  let state = "menu"; // menu | playing | paused | dying | levelclear | gameover
  let score = 0, best = 0, level = 1, lives = 3, extraAt = 10000;
  let aliens = [], dir = 1, moveTimer = 0, frame = 0, totalAliens = ROWS * COLS;
  let pBullets = [], eBullets = [], parts = [], floaters = [];
  let hive = null, hiveTimer = 0;
  let fireTimer = 0, dyingTimer = 0, clearTimer = 0, shake = 0;

  const ship = { x: W / 2, y: H - 78, w: sprW(SPR.ship), h: sprH(SPR.ship), speed: 340, cool: 0 };
  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.8 + 0.2
  }));

  try { best = parseInt(localStorage.getItem("hive-assault-best") || "0", 10) || 0; }
  catch (e) { best = 0; }
  function saveBest() { try { localStorage.setItem("hive-assault-best", String(best)); } catch (e) {} }

  function spawnWave() {
    aliens = [];
    const x0 = (W - COLS * CELL_W) / 2;
    const y0 = 86 + Math.min((level - 1) * 10, 60);
    for (let r = 0; r < ROWS; r++) {
      const kind = r === 0 ? "queen" : r < 3 ? "worker" : "drone";
      const k = KINDS[kind];
      const w = sprW(k.spr[0]), h = sprH(k.spr[0]);
      for (let c = 0; c < COLS; c++) {
        aliens.push({
          kind: kind, alive: true, col: c, row: r, w: w, h: h,
          x: x0 + c * CELL_W + (CELL_W - w) / 2,
          y: y0 + r * CELL_H
        });
      }
    }
    totalAliens = aliens.length;
    dir = 1; moveTimer = 0; frame = 0;
    hive = null; hiveTimer = 14 + Math.random() * 10;
    fireTimer = 1.2;
  }

  function newGame() {
    score = 0; level = 1; lives = 3; extraAt = 10000;
    pBullets = []; eBullets = []; parts = []; floaters = [];
    ship.x = W / 2; ship.cool = 0;
    resetShields(); spawnWave();
    state = "playing";
  }

  function aliveCount() {
    let n = 0;
    for (const a of aliens) if (a.alive) n++;
    return n;
  }

  function boom(x, y, color, n, power) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2, sp = (0.3 + Math.random()) * power;
      parts.push({
        x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20,
        life: 0.45 + Math.random() * 0.4, t: 0, color: color
      });
    }
  }
  function floatText(x, y, str, color) { floaters.push({ x: x, y: y, text: str, color: color, t: 0 }); }

  /* ---------- 輸入 ---------- */
  const keys = new Set();
  const held = { left: false, right: false, fire: false };
  const pointer = { active: false, x: null };

  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowleft", "arrowright", "arrowup", "arrowdown"].indexOf(k) >= 0) e.preventDefault();
    if (keys.has(k)) return;
    keys.add(k);
    if (k === "m") { muted = !muted; return; }
    if (k === "p" && (state === "playing" || state === "paused")) {
      state = state === "playing" ? "paused" : "playing";
      return;
    }
    if ((k === "enter" || k === " ") && (state === "menu" || state === "gameover")) {
      ac(); newGame();
    }
  });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  addEventListener("blur", () => {
    keys.clear();
    held.left = held.right = held.fire = false;
    pointer.active = false; pointer.x = null;
  });

  function bindButton(id, prop) {
    const el = document.getElementById(id);
    const on = e => {
      e.preventDefault(); ac();
      held[prop] = true;
      if (state === "menu" || state === "gameover") newGame();
    };
    const off = e => { e.preventDefault(); held[prop] = false; };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("pointerleave", off);
  }
  bindButton("btnL", "left");
  bindButton("btnF", "fire");
  bindButton("btnR", "right");

  cv.addEventListener("pointerdown", e => {
    cv.focus(); ac();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (state === "menu" || state === "gameover") { newGame(); return; }
    pointer.active = true;
    pointer.x = (e.offsetX / cv.clientWidth) * W;
  });
  cv.addEventListener("pointermove", e => {
    if (pointer.active) pointer.x = (e.offsetX / cv.clientWidth) * W;
  });
  function releasePointer() { pointer.active = false; pointer.x = null; }
  cv.addEventListener("pointerup", releasePointer);
  cv.addEventListener("pointercancel", releasePointer);

  /* ---------- 更新 ---------- */
  function fire() {
    if (ship.cool > 0 || pBullets.length >= 2) return;
    pBullets.push({ x: ship.x - 1.5, y: ship.y - 10, w: 3, h: 12 });
    ship.cool = 0.22;
    sfx.shoot();
  }

  function alienStep() {
    frame ^= 1;
    const live = aliens.filter(a => a.alive);
    if (!live.length) return;
    const dx = dir * 8;
    let minX = Infinity, maxX = -Infinity;
    for (const a of live) {
      if (a.x + dx < minX) minX = a.x + dx;
      if (a.x + a.w + dx > maxX) maxX = a.x + a.w + dx;
    }
    if (minX < MARGIN || maxX > W - MARGIN) {
      dir *= -1;
      for (const a of live) a.y += DROP;
    } else {
      for (const a of live) a.x += dx;
    }
    sfx.step();
    for (const a of live) {
      if (a.y + a.h >= SH_Y) collideShields(a.x, a.y, a.w, a.h, 3);
      if (a.y + a.h >= ship.y) { lives = 1; killShip(); return; }
    }
  }

  function alienFire() {
    const bottoms = new Map();
    for (const a of aliens) {
      if (!a.alive) continue;
      const cur = bottoms.get(a.col);
      if (!cur || a.y > cur.y) bottoms.set(a.col, a);
    }
    const arr = Array.from(bottoms.values());
    if (!arr.length) return;
    const a = arr[Math.floor(Math.random() * arr.length)];
    eBullets.push({
      x: a.x + a.w / 2 - 1.5, y: a.y + a.h, w: 3, h: 11,
      vy: 200 + level * 14, wob: Math.random() * 6.28
    });
  }

  function killShip() {
    if (state !== "playing") return;
    state = "dying"; dyingTimer = 1.4; shake = 14;
    lives--;
    eBullets = []; pBullets = [];
    boom(ship.x, ship.y + ship.h / 2, PAL.cyan, 40, 150);
    sfx.die();
  }

  function addScore(n) {
    score += n;
    if (score >= extraAt) {
      extraAt += 10000; lives++;
      sfx.bonus();
      floatText(ship.x, ship.y - 30, "1UP", PAL.cyan);
    }
    if (score > best) { best = score; saveBest(); }
  }

  function update(dt) {
    for (const s of stars) {
      s.y += (8 + s.z * 26) * dt;
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 190 * dt;
      if (p.t >= p.life) parts.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.t += dt; f.y -= 26 * dt;
      if (f.t > 0.9) floaters.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - 40 * dt);

    if (state === "dying") {
      dyingTimer -= dt;
      if (dyingTimer <= 0) {
        if (lives <= 0) state = "gameover";
        else { ship.x = W / 2; ship.cool = 0.5; state = "playing"; }
      }
      return;
    }
    if (state === "levelclear") {
      clearTimer -= dt;
      if (clearTimer <= 0) { level++; resetShields(); spawnWave(); state = "playing"; }
      return;
    }
    if (state !== "playing") return;

    /* 玩家 */
    const left = keys.has("arrowleft") || keys.has("a") || held.left;
    const right = keys.has("arrowright") || keys.has("d") || held.right;
    if (left) ship.x -= ship.speed * dt;
    if (right) ship.x += ship.speed * dt;
    if (pointer.x !== null) {
      const d = pointer.x - ship.x;
      const max = ship.speed * dt * 1.6;
      ship.x += Math.max(-max, Math.min(max, d));
    }
    ship.x = Math.max(MARGIN + ship.w / 2, Math.min(W - MARGIN - ship.w / 2, ship.x));
    ship.cool -= dt;
    if (keys.has(" ") || keys.has("arrowup") || held.fire || pointer.active) fire();

    /* 蜂群前進 */
    const ratio = aliveCount() / totalAliens;
    const interval = Math.max(0.065, (0.62 * ratio + 0.06) / (1 + (level - 1) * 0.18));
    moveTimer += dt;
    if (moveTimer >= interval) { moveTimer = 0; alienStep(); }
    if (state !== "playing") return;

    /* 蜂群射擊 */
    fireTimer -= dt;
    if (fireTimer <= 0) {
      alienFire();
      fireTimer = Math.max(0.25, (1.35 - level * 0.09) * (0.45 + ratio * 0.75)) * (0.6 + Math.random() * 0.8);
    }

    /* 蜂巢母艦 */
    hiveTimer -= dt;
    if (!hive && hiveTimer <= 0) {
      const fromLeft = Math.random() < 0.5;
      hive = {
        x: fromLeft ? -sprW(SPR.hive) : W,
        y: 48,
        vx: fromLeft ? 105 : -105,
        w: sprW(SPR.hive), h: sprH(SPR.hive)
      };
      sfx.hive();
      hiveTimer = 18 + Math.random() * 12;
    }
    if (hive) {
      hive.x += hive.vx * dt;
      if (hive.x < -hive.w - 10 || hive.x > W + 10) hive = null;
    }

    /* 玩家子彈 */
    for (let i = pBullets.length - 1; i >= 0; i--) {
      const b = pBullets[i];
      b.y -= 620 * dt;
      if (b.y + b.h < 0) { pBullets.splice(i, 1); continue; }

      if (hive && b.x < hive.x + hive.w && b.x + b.w > hive.x &&
          b.y < hive.y + hive.h && b.y + b.h > hive.y) {
        const pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
        addScore(pts);
        floatText(hive.x + hive.w / 2, hive.y, String(pts), PAL.cyan);
        boom(hive.x + hive.w / 2, hive.y + hive.h / 2, PAL.cyan, 26, 130);
        hive = null; pBullets.splice(i, 1); sfx.bonus();
        continue;
      }

      let hitAlien = false;
      for (const a of aliens) {
        if (!a.alive) continue;
        if (b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
          a.alive = false;
          addScore(KINDS[a.kind].pts);
          boom(a.x + a.w / 2, a.y + a.h / 2, KINDS[a.kind].main, 14, 110);
          sfx.hit();
          hitAlien = true;
          break;
        }
      }
      if (hitAlien) { pBullets.splice(i, 1); continue; }
      if (collideShields(b.x, b.y, b.w, b.h, 2)) { pBullets.splice(i, 1); sfx.shield(); }
    }

    /* 敵方子彈 */
    for (let i = eBullets.length - 1; i >= 0; i--) {
      const b = eBullets[i];
      b.y += b.vy * dt; b.wob += dt * 14;
      if (b.y > H) { eBullets.splice(i, 1); continue; }
      if (collideShields(b.x, b.y, b.w, b.h, 2)) { eBullets.splice(i, 1); sfx.shield(); continue; }
      const sx = ship.x - ship.w / 2;
      if (b.x < sx + ship.w && b.x + b.w > sx && b.y + b.h > ship.y && b.y < ship.y + ship.h) {
        eBullets.splice(i, 1);
        killShip();
        return;
      }
    }

    if (aliveCount() === 0) { state = "levelclear"; clearTimer = 1.8; sfx.level(); }
  }

  /* ---------- 繪製 ---------- */
  const pixelFont = px => px + 'px "Press Start 2P","Courier New",monospace';
  const hanFont = (px, w) => (w || 700) + " " + px + 'px "Noto Sans TC","Microsoft JhengHei",sans-serif';

  function text(str, x, y, font, color, align) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = align || "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    text("SCORE", 24, 30, pixelFont(10), PAL.dim, "left");
    text(String(score).padStart(5, "0"), 24, 54, pixelFont(16), PAL.cream, "left");
    text("HI-SCORE", W / 2, 30, pixelFont(10), PAL.dim);
    text(String(best).padStart(5, "0"), W / 2, 54, pixelFont(16), PAL.honey);
    text("LEVEL", W - 24, 30, pixelFont(10), PAL.dim, "right");
    text(String(level).padStart(2, "0"), W - 24, 54, pixelFont(16), PAL.cream, "right");

    for (let i = 0; i < Math.min(lives - 1, 5); i++) {
      drawSprite(SPR.ship, 24 + i * 32, H - 32, PAL.cyan, PAL.shipStripe, 2);
    }
    if (lives - 1 > 5) text("+" + (lives - 6), 24 + 5 * 32 + 6, H - 18, pixelFont(10), PAL.cyan, "left");
    if (muted) text("MUTE", W - 24, H - 20, pixelFont(10), PAL.dim, "right");

    ctx.fillStyle = "rgba(244,233,208,.12)";
    ctx.fillRect(20, H - 46, W - 40, 1);
  }

  function drawScene() {
    for (const s of stars) {
      const bright = s.z > 0.75;
      ctx.fillStyle = bright ? "rgba(244,233,208,.75)" : "rgba(138,134,168," + (0.25 + s.z * 0.4) + ")";
      ctx.fillRect(s.x | 0, s.y | 0, bright ? 2 : 1, bright ? 2 : 1);
    }

    for (const sh of shields) {
      for (let r = 0; r < SH_ROWS; r++) {
        for (let c = 0; c < SH_COLS; c++) {
          if (!sh.cells[r][c]) continue;
          ctx.fillStyle = r < 3 ? PAL.honey : PAL.honeyDeep;
          ctx.fillRect(sh.x + c * SH_CELL, sh.y + r * SH_CELL, SH_CELL, SH_CELL);
        }
      }
    }

    if (hive) drawSprite(SPR.hive, hive.x, hive.y, PAL.cyan, PAL.hiveStripe);

    for (const a of aliens) {
      if (!a.alive) continue;
      const k = KINDS[a.kind];
      drawSprite(k.spr[frame], a.x, a.y, k.main, k.stripe);
    }

    if (state !== "dying" && state !== "gameover") {
      const blink = ship.cool > 0.25 && Math.floor(ship.cool * 14) % 2 === 0;
      if (!blink) drawSprite(SPR.ship, ship.x - ship.w / 2, ship.y, PAL.cyan, PAL.shipStripe);
    }

    ctx.fillStyle = PAL.cream;
    for (const b of pBullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    for (const b of eBullets) {
      ctx.fillStyle = PAL.rose;
      const wob = Math.sin(b.wob) * 2;
      ctx.fillRect(b.x + wob, b.y, b.w, b.h * 0.55);
      ctx.fillRect(b.x - wob, b.y + b.h * 0.55, b.w, b.h * 0.45);
    }

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x | 0, p.y | 0, 3, 3);
    }
    ctx.globalAlpha = 1;
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 0.9);
      text(f.text, f.x, f.y, pixelFont(12), f.color);
    }
    ctx.globalAlpha = 1;
  }

  function panel(y, h) {
    ctx.fillStyle = "rgba(10,11,26,.88)";
    ctx.fillRect(0, y, W, h);
    ctx.fillStyle = "rgba(255,194,51,.35)";
    ctx.fillRect(0, y, W, 1);
    ctx.fillRect(0, y + h - 1, W, 1);
  }

  function drawOverlays(t) {
    const pulse = Math.floor(t * 1.8) % 2 === 0;
    if (state === "menu") {
      panel(180, 248);
      text("蜂巢突擊", W / 2, 244, hanFont(46), PAL.honey);
      text("HIVE  ASSAULT", W / 2, 278, pixelFont(14), PAL.cream);
      text("蜂群正在下降，守住最後四座蜂蠟掩體。", W / 2, 326, hanFont(18, 400), PAL.dim);
      if (pulse) text("PRESS ENTER TO START", W / 2, 382, pixelFont(13), PAL.cyan);
      text("← →  移動　　SPACE  發射　　P  暫停", W / 2, 414, hanFont(15, 400), PAL.dim);
    } else if (state === "paused") {
      panel(250, 100);
      text("暫停", W / 2, 300, hanFont(38), PAL.cream);
      text("PRESS P TO RESUME", W / 2, 330, pixelFont(11), PAL.dim);
    } else if (state === "levelclear") {
      panel(250, 100);
      text("第 " + level + " 波清空", W / 2, 300, hanFont(34), PAL.honey);
      text("WAVE " + (level + 1) + " INCOMING", W / 2, 330, pixelFont(11), PAL.cyan);
    } else if (state === "gameover") {
      panel(190, 226);
      text("GAME OVER", W / 2, 254, pixelFont(30), PAL.rose);
      text("得分 " + score + "　　最高 " + best + "　　抵達第 " + level + " 波",
           W / 2, 302, hanFont(20, 400), PAL.cream);
      if (score >= best && score > 0) text("NEW HIGH SCORE!", W / 2, 338, pixelFont(13), PAL.honey);
      if (pulse) text("PRESS ENTER TO RETRY", W / 2, 388, pixelFont(13), PAL.cyan);
    }
  }

  /* ---------- 主迴圈 ---------- */
  let last = performance.now(), clock = 0;
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    clock += dt;

    if (state !== "paused") update(dt);

    ctx.fillStyle = PAL.void;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawScene();
    ctx.restore();
    drawHUD();
    drawOverlays(clock);

    requestAnimationFrame(loop);
  }

  resetShields();
  spawnWave();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
